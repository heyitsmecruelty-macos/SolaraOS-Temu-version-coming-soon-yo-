<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EBMS Launchpage</title>
  <link rel="icon" type="image/png" href="img assets/ebms.png"/>
  <style>
    :root {
      --bg-1: #0d1322;
      --bg-2: #181d35;
      --panel: rgba(17, 23, 37, 0.78);
      --panel-border: rgba(184, 194, 221, 0.18);
      --text: #eef4ff;
      --muted: #c9d5ee;
      --accent: #8fd0ff;
      --accent-2: #c59fff;
      --highlight: #88f3d1;
      --shadow: rgba(4, 8, 20, 0.46);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(143, 208, 255, 0.18), transparent 28%),
        radial-gradient(circle at bottom right, rgba(197, 159, 255, 0.22), transparent 33%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2) 55%, #1d243d);
    }

    .page-shell {
      width: min(780px, calc(100vw - 30px));
      padding: 24px 0 40px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
      padding: 0 6px;
    }

    .brand {
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 800;
      font-size: 0.82rem;
      color: var(--highlight);
    }

    .nav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav a {
      color: var(--text);
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.04);
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 600;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .nav a:hover {
      transform: translateY(-1px);
      border-color: rgba(143, 208, 255, 0.42);
      background: rgba(143, 208, 255, 0.08);
    }

    .card {
      position: relative;
      padding: 32px 26px;
      border-radius: 28px;
      border: 1px solid var(--panel-border);
      background: var(--panel);
      box-shadow: 0 24px 56px var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.12), transparent 28%, transparent 70%, rgba(145, 110, 255, 0.1));
      pointer-events: none;
    }

    .card-inner {
      position: relative;
      display: grid;
      place-items: center;
      text-align: center;
      gap: 18px;
      padding: 10px 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(143,208,255,0.18), rgba(197,159,255,0.2));
      border: 1px solid rgba(143,208,255,0.28);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 18px 34px rgba(75, 91, 151, 0.28);
      font-size: 2.2rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.25rem, 6vw, 4rem);
      line-height: 1;
      letter-spacing: -0.05em;
      color: #ffffff;
    }

    .tagline {
      margin: 0;
      max-width: 520px;
      font-size: 1.1rem;
      line-height: 1.8;
      color: var(--muted);
    }

    .callout {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      border-radius: 999px;
      background: rgba(136, 243, 209, 0.1);
      border: 1px solid rgba(136, 243, 209, 0.22);
      color: var(--highlight);
      font-weight: 700;
      letter-spacing: 0.02em;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      box-shadow: 0 8px 18px rgba(73, 110, 103, 0.18);
    }

    .callout:hover,
    .callout:focus-visible {
      transform: translateY(-1px);
      border-color: rgba(136, 243, 209, 0.38);
      box-shadow: 0 14px 26px rgba(73, 110, 103, 0.22);
      outline: none;
    }

    .button-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      border-radius: 999px;
      color: white;
      text-decoration: none;
      border: 1px solid rgba(143,208,255,0.22);
      background: linear-gradient(135deg, rgba(143,208,255,0.18), rgba(197,159,255,0.12));
      font-weight: 700;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 10px 20px rgba(68, 72, 99, 0.22);
    }

    .button-link:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 26px rgba(68, 72, 99, 0.24);
    }

    @media (max-width: 520px) {
      .top-bar {
        flex-direction: column;
        align-items: flex-start;
      }

      .card {
        padding: 26px 18px;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <div class="top-bar">
      <div class="brand">Tags</div>
      <nav class="nav" aria-label="Main navigation">
        <a href="MAIN.html">Open Desktop</a>
        <a href="INFO.html">Info</a>
      </nav>
    </div>

    <main class="card" aria-label="Contributors page">
      <div class="card-inner">
        <div class="badge" aria-hidden="true">✦</div>
        <h1>Solo Dev!</h1><p>(Misleading title, eh)</p>

        <p class="tagline">If you want to help, go to <a href="INFO.html" style="color: white; text-decoration: none; font-weight: 700;">INFO.html</a> and contact me.</p>

        <a class="callout" href="contact.html">Open to Contact Me!</a>

        <div style="margin-top: 8px;">
          <a class="button-link" href="INFO.html">Contact the creator</a>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
